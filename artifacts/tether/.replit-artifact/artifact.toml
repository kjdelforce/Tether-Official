kind = "web"
previewPath = "/"
title = "Tether"
version = "1.0.0"
id = "artifacts/tether"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21788

[services.development]
run = "pnpm --filter @workspace/tether run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tether", "run", "build" ]
publicDir = "artifacts/tether/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21788"
BASE_PATH = "/"
